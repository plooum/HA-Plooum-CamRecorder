snapshot:
  target:
    entity:
      domain: camera

record:
  target:
    entity:
      domain: camera
  fields:
    duration:
      default: 30
      selector:
        number:
          min: 1
          max: 21600
          unit_of_measurement: s
          mode: box
    lookback:
      default: 0
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: s
          mode: box

start_recording:
  target:
    entity:
      domain: camera
  fields:
    max_duration:
      default: 600
      selector:
        number:
          min: 1
          max: 21600
          unit_of_measurement: s
          mode: box
    lookback:
      default: 0
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: s
          mode: box

stop_recording:
  target:
    entity:
      domain: camera
